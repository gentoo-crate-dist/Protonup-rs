
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: projg2/crate-dist-action@v1
        with:
          directories: libprotonup protonup-rs
          dist-filename: Protonup-rs-0.15.0-crates.tar.xz
          run-cargo-update: false

